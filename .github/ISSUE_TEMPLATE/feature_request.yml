name: Feature request / 功能建议
description: Propose a new behavior or improvement. / 提议新功能或改进。
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / 要解决的问题
      description: What happens in the group today, and why it falls short. / 现在群里是什么情况，哪里不够好。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior / 期望行为
    validations:
      required: true
  - type: textarea
    id: cost
    attributes:
      label: Cost and alternatives / 成本与替代方案
      description: Extra model tokens per message, new services or config, and whether deterministic code could do it instead. / 每条消息新增的模型 token、新服务或配置项，以及能否用确定性代码实现。
